<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TECMOPIA PC通知 登録</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#111827;font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:32px 18px 50px}
.card{background:#fff;border:1px solid #dbe4ee;border-radius:18px;box-shadow:0 12px 35px rgba(15,23,42,.10);overflow:hidden}
.head{padding:22px 24px;background:#0f172a;color:#fff}
.head h1{margin:0;font-size:23px}.head p{margin:6px 0 0;color:#cbd5e1;font-size:13px}
.body{padding:22px 24px}.status{padding:12px;border-radius:11px;background:#eff6ff;color:#1e3a8a;font-weight:800;font-size:13px;line-height:1.5;margin-bottom:16px}
.status.ok{background:#ecfdf5;color:#166534}.status.err{background:#fef2f2;color:#991b1b}
label{display:block;margin:13px 0 0;font-size:12px;font-weight:900;color:#475569}
input{width:100%;margin-top:5px;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:#fff}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-size:16px;font-weight:950;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.steps{display:grid;gap:8px;margin-top:18px}.step{display:flex;gap:9px;align-items:flex-start;padding:10px;border-radius:10px;background:#f8fafc;color:#475569;font-size:12px}.step b{color:#0f172a}
.small{margin-top:14px;color:#64748b;font-size:11px;line-height:1.6}.fid{display:none;margin-top:12px;padding:9px;border-radius:8px;background:#f8fafc;color:#64748b;font-size:10px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="head"><h1>🔔 TECMOPIA PC通知</h1><p>このPCをWeb Push通知端末として登録します</p></div><div class="body">
<div id="status" class="status">① PC管理画面で「登録コード」を発行してから入力してください。</div>
<label>GAS WebアプリURL<input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
<label>登録コード（6桁）<input id="pairCode" inputmode="numeric" maxlength="6" placeholder="123456"></label>
<label>このPCの名前<input id="deviceName" maxlength="50" placeholder="例：事務所PC"></label>
<button id="registerBtn" type="button">このPCで通知を受け取る</button>
<div id="fidBox" class="fid"></div>
<div class="steps"><div class="step"><b>1.</b><span>Edgeの通知許可が出たら「許可」を押します。</span></div><div class="step"><b>2.</b><span>登録完了後、このページやDashboardのタブを閉じてもService Workerが通知を受信します。</span></div><div class="step"><b>3.</b><span>PC管理画面の「テスト通知」で受信確認してください。</span></div></div>
<div class="small">※ Firebaseの現行推奨方式（Firebase Installation ID / FID）で登録します。</div>
</div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getMessaging, register, onRegistered, onMessage } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";

const firebaseConfig = {"apiKey":"AIzaSyD93d904TqIX9mTne67DWkd4W71e3aDcxM","authDomain":"tecmopia-push.firebaseapp.com","projectId":"tecmopia-push","storageBucket":"tecmopia-push.firebasestorage.app","messagingSenderId":"469386287853","appId":"1:469386287853:web:5450c3536fe30f7de78ae4"};
const VAPID_KEY='BM06HaA0sSiVNvccQrts4cqoLMrYTTjMkReyHN7440gLMrjhYy-Vxj_GAMUKQknPq_6c6caH3VC3g5v4bBHdEz4';

const app=initializeApp(firebaseConfig);
const messaging=getMessaging(app);
console.info('[TECMOPIA Push] FID register v1 loaded');

const gasUrl=document.getElementById('gasUrl');
const pairCode=document.getElementById('pairCode');
const deviceName=document.getElementById('deviceName');
const registerBtn=document.getElementById('registerBtn');
const statusEl=document.getElementById('status');
const fidBox=document.getElementById('fidBox');

gasUrl.value=localStorage.getItem('tecmopia_push_gas_url')||'';
deviceName.value=localStorage.getItem('tecmopia_push_device_name')||'事務所PC';
let pending=null;
let waitTimer=null;

function setStatus(text,cls=''){statusEl.textContent=text;statusEl.className='status'+(cls?' '+cls:'');}
function normalizeGasUrl(value){const url=String(value||'').trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url))throw new Error('GAS Webアプリの /exec URLを入力してください。');return url.split('?')[0];}
function jsonp(url,params){return new Promise((resolve,reject)=>{const cb='__tecmopiaPushCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const timer=setTimeout(()=>cleanup(new Error('GASへの登録がタイムアウトしました。')),15000);const script=document.createElement('script');function cleanup(err,value){clearTimeout(timer);try{delete window[cb];}catch(e){}script.remove();if(err)reject(err);else resolve(value);}window[cb]=data=>cleanup(null,data);const qs=new URLSearchParams(Object.assign({},params,{callback:cb}));script.src=url+'?'+qs.toString();script.onerror=()=>cleanup(new Error('GASへ接続できませんでした。'));document.head.appendChild(script);});}

async function uploadFid(fid){
  if(!pending||pending.uploading)return;
  pending.uploading=true;
  try{
    const result=await jsonp(pending.gas,{mode:'push-register',code:pending.code,fid:fid,name:pending.name,ua:navigator.userAgent});
    if(!result||!result.ok)throw new Error((result&&result.message)||'端末登録に失敗しました。');
    localStorage.setItem('tecmopia_push_gas_url',pending.gas);
    localStorage.setItem('tecmopia_push_device_name',pending.name);
    localStorage.setItem('tecmopia_push_fid',fid);
    localStorage.removeItem('tecmopia_push_token');
    if(waitTimer){clearTimeout(waitTimer);waitTimer=null;}
    fidBox.style.display='block';fidBox.textContent='Firebase Installation ID：'+fid;
    setStatus('✅ 登録完了。このPCはWeb Push通知を受け取れます。','ok');
    registerBtn.disabled=false;registerBtn.textContent='登録済み（再登録も可能）';pending=null;
  }catch(err){
    if(pending)pending.uploading=false;
    registerBtn.disabled=false;registerBtn.textContent='このPCで通知を受け取る';
    setStatus('❌ '+(err&&err.message?err.message:err),'err');
  }
}

onRegistered(messaging,(fid)=>{
  console.info('[TECMOPIA Push] onRegistered FID',fid);
  if(pending)uploadFid(fid);
});

onMessage(messaging,payload=>{const d=payload&&payload.data||{};setStatus('🔔 '+(d.title||'通知')+(d.body?' — '+d.body:''),'ok');});

registerBtn.addEventListener('click',async()=>{
  registerBtn.disabled=true;registerBtn.textContent='登録しています...';
  try{
    const gas=normalizeGasUrl(gasUrl.value);const code=pairCode.value.trim();const name=deviceName.value.trim()||'店舗PC';
    if(!/^\d{6}$/.test(code))throw new Error('6桁の登録コードを入力してください。');
    if(!('Notification'in window)||!('serviceWorker'in navigator))throw new Error('このブラウザはWeb Pushに対応していません。');
    setStatus('Edgeの通知許可を確認しています...');
    const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('Edgeの通知が許可されていません。');
    setStatus('Service Workerを準備しています...');
    const sw=await navigator.serviceWorker.register('./firebase-messaging-sw.js',{scope:'./'});await navigator.serviceWorker.ready;
    pending={gas,code,name,uploading:false};
    setStatus('Firebase Installation IDで登録しています...');
    waitTimer=setTimeout(()=>{if(pending){pending=null;registerBtn.disabled=false;registerBtn.textContent='このPCで通知を受け取る';setStatus('❌ FIDの登録応答がタイムアウトしました。もう一度お試しください。','err');}},20000);
    await register(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:sw});
  }catch(err){
    if(waitTimer){clearTimeout(waitTimer);waitTimer=null;}pending=null;registerBtn.disabled=false;registerBtn.textContent='このPCで通知を受け取る';setStatus('❌ '+(err&&err.message?err.message:err),'err');
  }
});

const savedFid=localStorage.getItem('tecmopia_push_fid');if(savedFid){fidBox.style.display='block';fidBox.textContent='前回登録FID：'+savedFid;}
</script>
</body></html>
